name: Ayah
options:
  bundleIdPrefix: com.ayah
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
packages:
  AyahKit:
    path: Packages/AyahKit
targets:
  Ayah:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "Ayah.entitlements"
      - path: Resources
        excludes:
          - "**/SOURCE.md"
          - "**/VERSION"
          - "**/MANIFEST.json"
        buildPhase: resources
    preBuildScripts:
      - name: "Quran integrity gate (Release only)"
        script: |
          if [ "$CONFIGURATION" = "Release" ]; then
            set -e
            echo "Release build — verifying Quran data integrity before compiling..."
            (cd "$SRCROOT/Scripts/verify_quran" && swift build)
            "$SRCROOT/Scripts/verify_quran/.build/debug/verify_quran" "$SRCROOT/Resources/Quran"
            (cd "$SRCROOT/Packages/AyahKit" && swift test)
          else
            echo "Skipping Quran integrity gate for $CONFIGURATION build (Release-only, see ARCHITECTURE.md §8)."
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayah.app
        PRODUCT_NAME: Ayah
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/Ayah.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: "3"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          ARCHS: arm64
          ONLY_ACTIVE_ARCH: NO
          CODE_SIGNING_REQUIRED: YES
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    dependencies:
      - package: AyahKit
    # An explicit scheme (rather than xcodebuild's autocreated one) so
    # `xcodebuild test` runs AyahTests deterministically, locally and in
    # CI, without depending on scheme autocreation to notice the bundle.
    scheme:
      testTargets:
        - AyahTests

  # App-layer unit tests (`NotchViewModel`'s state machine). Runs under
  # `xcodebuild test`, not `swift test` — AyahKit keeps its own suite.
  # Hosted in the Ayah app so `@testable import Ayah` can reach the App
  # target's internal types; `link: false` on the package keeps AyahKit a
  # single static copy inside the host, since linking it into the test
  # bundle too would give the two modules distinct, incompatible copies of
  # every AyahKit type.
  AyahTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Tests/App
    dependencies:
      - target: Ayah
      - package: AyahKit
        link: false
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
