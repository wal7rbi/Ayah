# Quran data supply-chain verification (see ARCHITECTURE.md §8 and
# SECURITY.md's trust-model section), plus both test suites. Runs
# unconditionally on every push and pull request — verify_quran and the
# tests are all fast enough that there's no cost benefit to
# path-filtering, and a path filter is itself a footgun (a future file
# this should cover could silently fall outside it).
#
# What this does NOT prove, by design (documented, not glossed over):
#   - It does not verify that a PR's claimed official MD5/SHA-1 in
#     MANIFEST.json genuinely came from KFGQPC's download page — that
#     still requires a human reviewer to check the live page.
#   - It does not re-download and re-run the full import from the
#     original KFGQPC source on every run — that would make CI depend on
#     an external network resource outside this project's control. It
#     verifies self-consistency of what's already committed instead.
name: Quran Integrity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quran-verify:
    # macOS 14 selects Xcode 15.4 / Swift 5.10, but every local package in
    # this repository declares swift-tools-version 6.0. macOS 15 currently
    # selects Xcode 16.4 and a Swift 6 toolchain on GitHub-hosted runners.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record selected Swift and Xcode toolchains
        run: |
          swift --version
          xcodebuild -version

      - name: Build verify_quran
        run: cd Scripts/verify_quran && swift build

      - name: Run verify_quran (structural checks + checksum + manifest cross-check)
        run: Scripts/verify_quran/.build/debug/verify_quran Resources/Quran

      - name: Run AyahKit test suite (includes Quran tampering-detection tests)
        run: cd Packages/AyahKit && swift test

      # App-layer tests (`Tests/App`). These are app-hosted, so unlike the
      # AyahKit suite above they need a full Xcode build and run inside a
      # real Ayah process — hence Debug and `xcodebuild test` rather than
      # `swift test`.
      - name: Run App test suite (NotchViewModel state machine)
        run: >-
          xcodebuild test -project Ayah.xcodeproj -scheme Ayah -configuration Debug
          -destination 'platform=macOS' -disableAutomaticPackageResolution

      - name: Build Release app using the reviewed package resolution
        run: >-
          xcodebuild -project Ayah.xcodeproj -scheme Ayah -configuration Release
          -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO build

      - name: Quran provenance guard
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          CHANGED=$(git diff --name-only "$BASE" "$HEAD" -- Resources/Quran/)
          if echo "$CHANGED" | grep -qx "Resources/Quran/quran.sqlite"; then
            for f in Resources/Quran/VERSION Resources/Quran/CHECKSUM Resources/Quran/MANIFEST.json; do
              if ! echo "$CHANGED" | grep -qx "$f"; then
                echo "quran.sqlite changed but $f did not — a legitimate re-import always updates VERSION/CHECKSUM/MANIFEST.json together. Refusing to pass without it." >&2
                exit 1
              fi
            done
          fi
